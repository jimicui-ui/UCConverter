# Azure DevOps Release Pipeline for Backend
# This pipeline builds and releases the .NET 8 API application

trigger: none  # Manual trigger or triggered by another pipeline

pool:
  vmImage: 'windows-latest'  # or 'ubuntu-latest' for Linux builds

variables:
  - group: BackendReleaseVariables  # Optional: Use variable groups for secrets
  - name: buildConfiguration
    value: 'Release'
  - name: solutionPath
    value: '$(System.DefaultWorkingDirectory)/UCConverter.sln'
  - name: apiProjectPath
    value: '$(System.DefaultWorkingDirectory)/src/UCConverter.Api/UCConverter.Api.csproj'
  - name: unitsSettingsPath
    value: '$(System.DefaultWorkingDirectory)/UnitsSettings'
  - name: publishPath
    value: '$(Build.ArtifactStagingDirectory)/publish'
  - name: artifactName
    value: 'backend-api'

stages:
  - stage: Build
    displayName: 'Build and Test Backend'
    jobs:
      - job: BuildBackend
        displayName: 'Build .NET API'
        steps:
          - task: UseDotNet@2
            displayName: 'Use .NET 8 SDK'
            inputs:
              packageType: 'sdk'
              version: '8.x'

          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet packages'
            inputs:
              command: 'restore'
              projects: '$(solutionPath)'

          - task: DotNetCoreCLI@2
            displayName: 'Build solution'
            inputs:
              command: 'build'
              projects: '$(solutionPath)'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'Run unit tests'
            inputs:
              command: 'test'
              projects: '$(solutionPath)'
              arguments: '--configuration $(buildConfiguration) --no-build --verbosity normal /p:CollectCoverage=true /p:CoverletOutputFormat=opencover /p:CoverletOutput=$(Agent.TempDirectory)/coverage/'
            continueOnError: false

          - task: DotNetCoreCLI@2
            displayName: 'Publish API'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: '$(apiProjectPath)'
              arguments: '--configuration $(buildConfiguration) --output $(publishPath) --no-build'
              zipAfterPublish: false

          - task: CopyFiles@2
            displayName: 'Copy UnitsSettings folder'
            inputs:
              SourceFolder: '$(unitsSettingsPath)'
              Contents: '**'
              TargetFolder: '$(publishPath)/UnitsSettings'
              flattenFolders: false

          - task: PublishBuildArtifacts@1
            displayName: 'Publish build artifacts'
            inputs:
              pathToPublish: '$(publishPath)'
              artifactName: '$(artifactName)'
              publishLocation: 'Container'

  - stage: Deploy
    displayName: 'Deploy Backend API'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployToStaging
        displayName: 'Deploy to Staging'
        environment: 'Staging'  # Create this environment in Azure DevOps
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@0
                  displayName: 'Download build artifacts'
                  inputs:
                    buildType: 'current'
                    downloadType: 'specific'
                    downloadPath: '$(System.ArtifactsDirectory)'
                    artifactName: '$(artifactName)'

                # Option 1: Deploy to Azure App Service
                - task: AzureWebApp@1
                  displayName: 'Deploy to Azure App Service'
                  inputs:
                    azureSubscription: $(azureSubscription)  # Set in service connections
                    appName: $(azureAppServiceName)  # Set in variable group
                    package: '$(System.ArtifactsDirectory)/$(artifactName)'
                    deploymentMethod: 'auto'
                  condition: eq(variables['deploymentTarget'], 'AzureAppService')
                  enabled: false  # Set to true if using Azure App Service

                # Option 2: Deploy to Azure App Service (Linux)
                - task: AzureWebApp@1
                  displayName: 'Deploy to Azure App Service (Linux)'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appName: $(azureAppServiceName)
                    package: '$(System.ArtifactsDirectory)/$(artifactName)'
                    deploymentMethod: 'auto'
                    runtimeStack: 'DOTNETCORE|8.0'
                  condition: eq(variables['deploymentTarget'], 'AzureAppServiceLinux')
                  enabled: false  # Set to true if using Azure App Service Linux

                # Option 3: Deploy to IIS (Windows Server)
                - task: IISWebAppManagementOnMachineGroup@0
                  displayName: 'Create or Update IIS Website'
                  inputs:
                    IISDeploymentType: 'IISWebsite'
                    ActionIISWebsite: 'CreateOrUpdateWebsite'
                    WebsiteName: 'UCConverterApi'
                    WebsitePhysicalPath: '%SystemDrive%\inetpub\wwwroot\UCConverterApi'
                    AddBinding: true
                    Bindings: '[{"protocol":"http","ipAddress":"*","port":"80","hostname":""},{"protocol":"https","ipAddress":"*","port":"443","hostname":"","sslThumbprint":""}]'
                  condition: eq(variables['deploymentTarget'], 'IIS')
                  enabled: false  # Set to true if using IIS

                - task: IISWebAppDeploymentOnMachineGroup@0
                  displayName: 'Deploy to IIS'
                  inputs:
                    WebSiteName: 'UCConverterApi'
                    Package: '$(System.ArtifactsDirectory)/$(artifactName)'
                    RemoveAdditionalFilesFlag: true
                    TakeAppOfflineFlag: true
                  condition: eq(variables['deploymentTarget'], 'IIS')
                  enabled: false  # Set to true if using IIS

                # Option 4: Deploy to Linux Web Server (Nginx/Kestrel)
                - task: SSH@0
                  displayName: 'Deploy to Linux Web Server'
                  inputs:
                    sshEndpoint: $(sshEndpoint)  # Set in service connections
                    runOptions: 'commands'
                    commands: |
                      # Stop the service
                      sudo systemctl stop ucconverter-api || true
                      # Copy files to web server
                      sudo cp -r $(System.ArtifactsDirectory)/$(artifactName)/* $(webServerPath)/
                      # Set permissions
                      sudo chown -R www-data:www-data $(webServerPath)
                      # Start the service
                      sudo systemctl start ucconverter-api
                      # Check service status
                      sudo systemctl status ucconverter-api
                  condition: eq(variables['deploymentTarget'], 'LinuxWebServer')
                  enabled: false  # Set to true if using Linux web server

                # Option 5: Deploy using Docker
                - task: Docker@2
                  displayName: 'Build Docker image'
                  inputs:
                    containerRegistry: $(dockerRegistryServiceConnection)
                    repository: $(dockerImageRepository)
                    command: 'buildAndPush'
                    Dockerfile: '$(System.DefaultWorkingDirectory)/Dockerfile'
                    tags: |
                      $(Build.BuildId)
                      latest
                  condition: eq(variables['deploymentTarget'], 'Docker')
                  enabled: false  # Set to true if using Docker

                # Option 6: Deploy to Azure Container Instances
                - task: AzureCLI@2
                  displayName: 'Deploy to Azure Container Instances'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      # Build and push Docker image first (use Docker task above)
                      # Then deploy to ACI
                      az container create \
                        --resource-group $(resourceGroupName) \
                        --name $(containerInstanceName) \
                        --image $(dockerImageRepository):$(Build.BuildId) \
                        --cpu 1 \
                        --memory 1.5 \
                        --registry-login-server $(dockerRegistry) \
                        --registry-username $(dockerRegistryUsername) \
                        --registry-password $(dockerRegistryPassword) \
                        --dns-name-label $(dnsNameLabel) \
                        --ports 80 443
                  condition: eq(variables['deploymentTarget'], 'AzureContainerInstances')
                  enabled: false  # Set to true if using Azure Container Instances

                # Option 7: Generic file copy (for any target)
                - task: CopyFiles@2
                  displayName: 'Copy files to deployment target'
                  inputs:
                    SourceFolder: '$(System.ArtifactsDirectory)/$(artifactName)'
                    Contents: '**'
                    TargetFolder: '$(deploymentTargetPath)'
                    cleanTargetFolder: true
                  condition: eq(variables['deploymentTarget'], 'FileCopy')
                  enabled: false  # Set to true if using file copy

                # Health check after deployment
                - task: PowerShell@2
                  displayName: 'Health check'
                  inputs:
                    targetType: 'inline'
                    script: |
                      $healthCheckUrl = "$(apiBaseUrl)/swagger"
                      Write-Host "Checking health at: $healthCheckUrl"
                      try {
                        $response = Invoke-WebRequest -Uri $healthCheckUrl -Method Get -TimeoutSec 30
                        if ($response.StatusCode -eq 200) {
                          Write-Host "Health check passed: API is responding"
                        } else {
                          Write-Host "Health check warning: Status code $($response.StatusCode)"
                        }
                      } catch {
                        Write-Host "Health check failed: $_"
                        # Don't fail the pipeline, just log the error
                      }
                  condition: and(succeeded(), ne(variables['apiBaseUrl'], ''))
                  enabled: true

      - deployment: DeployToProduction
        displayName: 'Deploy to Production'
        environment: 'Production'  # Create this environment in Azure DevOps
        dependsOn: DeployToStaging
        condition: succeeded()
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@0
                  displayName: 'Download build artifacts'
                  inputs:
                    buildType: 'current'
                    downloadType: 'specific'
                    downloadPath: '$(System.ArtifactsDirectory)'
                    artifactName: '$(artifactName)'

                # Add your production deployment steps here
                # (Similar to staging, but with production-specific settings)
                # Example: Deploy to Azure App Service Production slot
                - task: AzureWebApp@1
                  displayName: 'Deploy to Azure App Service (Production)'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appName: $(azureAppServiceNameProduction)
                    package: '$(System.ArtifactsDirectory)/$(artifactName)'
                    deploymentMethod: 'auto'
                  condition: eq(variables['deploymentTarget'], 'AzureAppService')
                  enabled: false  # Set to true if using Azure App Service

                # Health check for production
                - task: PowerShell@2
                  displayName: 'Production health check'
                  inputs:
                    targetType: 'inline'
                    script: |
                      $healthCheckUrl = "$(apiBaseUrlProduction)/swagger"
                      Write-Host "Checking production health at: $healthCheckUrl"
                      try {
                        $response = Invoke-WebRequest -Uri $healthCheckUrl -Method Get -TimeoutSec 30
                        if ($response.StatusCode -eq 200) {
                          Write-Host "Production health check passed: API is responding"
                        } else {
                          Write-Host "Production health check warning: Status code $($response.StatusCode)"
                        }
                      } catch {
                        Write-Host "Production health check failed: $_"
                      }
                  condition: and(succeeded(), ne(variables['apiBaseUrlProduction'], ''))
                  enabled: true

